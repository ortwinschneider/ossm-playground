apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cars-traffic-split
  namespace: travel-agency
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: cars
    port: 8000
  rules:
  - backendRefs:
    - name: cars-v1
      port: 8000
      weight: 70
    - name: cars-v2
      port: 8000
      weight: 30
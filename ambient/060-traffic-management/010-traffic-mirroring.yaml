apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: traffic-mirroring-cars-v2
  namespace: travel-agency
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: cars
    port: 8000
  rules:
  - filters:
    - type: RequestMirror
      requestMirror:
        percentage: 100
        backendRef:
          name: cars-v2
          port: 8000
    backendRefs:
    - name: cars
      port: 8000
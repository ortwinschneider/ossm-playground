apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: voyages-traffic-mirroring
  namespace: travel-portal
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: voyages
    port: 8000
  rules:
  - filters:
    - type: RequestMirror
      requestMirror:
        percentage: 50
        backendRef:
          name: voyages-v2
          port: 8000
    backendRefs:
    - name: voyages
      port: 8000